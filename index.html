<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini Red Social con CRUD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
    href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    body { font-family: Arial, sans-serif; }
    #feed, #register { display: none; }
    .post-card { margin: 10px 0; padding: 10px; }
    .post-actions { margin-top: 5px; }
  </style>
</head>
<body class="w3-light-grey">

<!-- LOGIN -->
<div id="login" class="w3-container" style="max-width:400px;margin-top:60px;">
  <div class="w3-card w3-white w3-round w3-padding">
    <h2 class="w3-center">Iniciar Sesión</h2>
    <p id="loginError" class="w3-text-red"></p>
    <form onsubmit="return login(event)">
      <input id="loginUser" class="w3-input w3-margin-bottom" type="text" placeholder="Usuario" required>
      <input id="loginPass" class="w3-input w3-margin-bottom" type="password" placeholder="Contraseña" required>
      <button class="w3-button w3-block w3-theme" type="submit">Entrar</button>
    </form>
    <p class="w3-center">
      ¿No tienes cuenta? 
      <a href="#" onclick="showRegister()">Regístrate aquí</a>
    </p>
  </div>
</div>

<!-- REGISTER -->
<div id="register" class="w3-container" style="max-width:400px;margin-top:60px;">
  <div class="w3-card w3-white w3-round w3-padding">
    <h2 class="w3-center">Registro</h2>
    <p id="regError" class="w3-text-red"></p>
    <form onsubmit="return register(event)">
      <input id="regUser" class="w3-input w3-margin-bottom" type="text" placeholder="Usuario" required>
      <input id="regPass" class="w3-input w3-margin-bottom" type="password" placeholder="Contraseña" required>
      <button class="w3-button w3-block w3-green" type="submit">Registrar</button>
    </form>
    <p class="w3-center">
      ¿Ya tienes cuenta?
      <a href="#" onclick="showLogin()">Inicia sesión</a>
    </p>
  </div>
</div>

<!-- FEED -->
<div id="feed" class="w3-container" style="margin-top:50px;max-width:600px;">
  <div class="w3-bar w3-theme-d2 w3-round">
    <span class="w3-bar-item" id="welcome"></span>
    <button onclick="logout()" class="w3-bar-item w3-button w3-right">Cerrar Sesión</button>
  </div>

  <div class="w3-card w3-round w3-white w3-margin-top w3-padding">
    <form onsubmit="return addPost(event)">
      <textarea id="newPost" class="w3-input w3-border w3-margin-bottom"
        placeholder="¿Qué estás pensando?" required></textarea>
      <button class="w3-button w3-theme" type="submit">Publicar</button>
    </form>
  </div>

  <div id="posts"></div>
</div>

<script>
  let currentUser = null;
  let posts = [];
  let users = [];

  // Al cargar
  window.onload = () => {
    // Usuarios guardados
    const savedUsers = localStorage.getItem("users");
    if (savedUsers) {
      users = JSON.parse(savedUsers);
    } else {
      users = [{ username: "admin", password: "1234" }];
      localStorage.setItem("users", JSON.stringify(users));
    }

    // Sesión activa
    const savedUser = localStorage.getItem("currentUser");
    if (savedUser) {
      currentUser = savedUser;
      showFeed();
    }

    // Posts guardados
    const savedPosts = localStorage.getItem("posts");
    if (savedPosts) {
      posts = JSON.parse(savedPosts);
      renderPosts();
    }
  };

  // --- LOGIN ---
  function login(e) {
    e.preventDefault();
    const user = document.getElementById("loginUser").value;
    const pass = document.getElementById("loginPass").value;
    const found = users.find(u => u.username === user && u.password === pass);
    if (found) {
      currentUser = user;
      localStorage.setItem("currentUser", user);
      showFeed();
    } else {
      document.getElementById("loginError").innerText = "Usuario o contraseña incorrectos";
    }
    return false;
  }

  // --- REGISTRO ---
  function register(e) {
    e.preventDefault();
    const user = document.getElementById("regUser").value;
    const pass = document.getElementById("regPass").value;

    if (users.find(u => u.username === user)) {
      document.getElementById("regError").innerText = "Ese usuario ya existe";
      return false;
    }

    users.push({ username: user, password: pass });
    localStorage.setItem("users", JSON.stringify(users));
    alert("Registro exitoso. Ahora inicia sesión.");
    showLogin();
    return false;
  }

  // --- CERRAR SESIÓN ---
  function logout() {
    currentUser = null;
    localStorage.removeItem("currentUser");
    document.getElementById("feed").style.display = "none";
    showLogin();
  }

  // --- PUBLICAR ---
  function addPost(e) {
    e.preventDefault();
    const content = document.getElementById("newPost").value;
    if (content.trim() !== "") {
      const newEntry = {
        id: Date.now(), // identificador único
        author: currentUser,
        text: content,
        date: new Date().toLocaleString()
      };
      posts.unshift(newEntry);
      savePosts();
      document.getElementById("newPost").value = "";
      renderPosts();
    }
    return false;
  }

  // --- EDITAR POST ---
  function editPost(id) {
    const post = posts.find(p => p.id === id);
    const nuevoTexto = prompt("Editar publicación:", post.text);
    if (nuevoTexto !== null && nuevoTexto.trim() !== "") {
      post.text = nuevoTexto;
      savePosts();
      renderPosts();
    }
  }

  // --- ELIMINAR POST ---
  function deletePost(id) {
    if (confirm("¿Seguro que quieres eliminar este post?")) {
      posts = posts.filter(p => p.id !== id);
      savePosts();
      renderPosts();
    }
  }

  // --- GUARDAR POSTS ---
  function savePosts() {
    localStorage.setItem("posts", JSON.stringify(posts));
  }

  // --- MOSTRAR POSTS ---
  function renderPosts() {
    const postsDiv = document.getElementById("posts");
    postsDiv.innerHTML = "";
    posts.forEach(p => {
      const card = document.createElement("div");
      card.className = "w3-card w3-round w3-white post-card";
      card.innerHTML = `
        <p><b>${p.author}</b> <span class="w3-small w3-text-grey">${p.date}</span></p>
        <p>${p.text}</p>
      `;
      // Botones solo para el autor
      if (p.author === currentUser) {
        const actions = document.createElement("div");
        actions.className = "post-actions";
        actions.innerHTML = `
          <button class="w3-button w3-small w3-blue w3-round" onclick="editPost(${p.id})">
            <i class="fa fa-pencil"></i> Editar
          </button>
          <button class="w3-button w3-small w3-red w3-round" onclick="deletePost(${p.id})">
            <i class="fa fa-trash"></i> Eliminar
          </button>
        `;
        card.appendChild(actions);
      }
      postsDiv.appendChild(card);
    });
  }

  // --- CAMBIO DE VISTAS ---
  function showFeed() {
    document.getElementById("login").style.display = "none";
    document.getElementById("register").style.display = "none";
    document.getElementById("feed").style.display = "block";
    document.getElementById("welcome").innerText = "Bienvenido " + currentUser;
    renderPosts();
  }

  function showLogin() {
    document.getElementById("login").style.display = "block";
    document.getElementById("register").style.display = "none";
    document.getElementById("feed").style.display = "none";
    document.getElementById("loginError").innerText = "";
  }

  function showRegister() {
    document.getElementById("login").style.display = "none";
    document.getElementById("register").style.display = "block";
    document.getElementById("feed").style.display = "none";
    document.getElementById("regError").innerText = "";
  }
</script>

</body>
</html>
